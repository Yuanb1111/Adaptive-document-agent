name: Linux PowerPoint rendering
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser notification and elapsed-time clock tests
        run: node --test tests/test_completion_notification_frontend.mjs tests/test_progress_timer_frontend.mjs
      - name: Install production renderer dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d; s/\r$//' packages.txt)
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          download_packages() {
            sudo timeout --kill-after=15s 2m apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update || return $?
            # Bound slow-but-active transfers too; socket timeouts alone do not.
            # Only terminate downloads, never an in-progress dpkg installation.
            sudo timeout --kill-after=15s 5m apt-get "${apt_options[@]}" --download-only install -y "${packages[@]}"
          }
          if ! download_packages; then
            echo "::warning::APT download failed or exceeded its time budget; retrying via the Ubuntu archive."
            # Hosted runners may use either a mirror list or direct source URLs.
            for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [[ -f "$source" ]]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              fi
            done
            # APT reuses complete archives and resumes partial downloads.
            download_packages
          fi
          sudo apt-get --no-download install -y "${packages[@]}"
      - name: Install Python dependencies
        timeout-minutes: 10
        run: python -m pip install --retries 3 --timeout 60 -r requirements-dev.txt
      - name: Full suite with real server-local rendering and offline isolation
        timeout-minutes: 15
        env:
          PPTX_QA_LIBREOFFICE_INTEGRATION: '1'
        run: python -m pytest -ra
      - name: Synthetic latency comparison with real LibreOffice
        timeout-minutes: 3
        run: python -m scripts.benchmark_performance --real-renderer
      - name: Offline generation request and scheduling benchmarks
        timeout-minutes: 3
        run: |
          python -m scripts.benchmark_generation_latency --repo . --repeats 10 > generation-latency.json
          python -c "import json; r=json.load(open('generation-latency.json')); print({'mode': r['mode'], 'schedule_median_ms': r['schedule']['median_wall_ms'], 'components': {k: {'calls': r[k]['calls'], 'wire': r[k]['requests']} for k in ('reasoning', 'brief', 'scoring')}})"
