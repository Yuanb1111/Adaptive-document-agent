<div class="completion-notice" hidden>
  <div class="notice-controls">
    <button type="button" class="notice-enable">Enable completion notifications</button>
    <label><input type="checkbox" class="notice-sound"> Play a short sound</label>
    <button type="button" class="notice-test">Test notification</button>
  </div>
  <p class="notice-status" role="status" aria-live="polite"></p>
  <p class="notice-help">Keep this tab open and connected; you can switch to another tab. Closing it stops notifications. Browser and system notification settings apply.</p>
</div>
