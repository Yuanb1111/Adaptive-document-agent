<div class="completion-notice" hidden>
  <button type="button" class="notice-trigger" aria-label="Completion notifications: Off" aria-expanded="false" aria-controls="notice-panel" title="Completion notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
    <span class="notice-dot" aria-hidden="true"></span>
  </button>
  <section class="notice-panel" id="notice-panel" aria-label="Completion notifications" hidden>
    <div class="notice-title">Completion notifications</div>
    <p class="notice-status" role="status" aria-live="polite"></p>
    <div class="notice-controls">
      <span class="notice-label">Notify when ready</span>
      <button type="button" class="notice-enable" role="switch" aria-label="Completion notifications" aria-checked="false">
        <span class="notice-switch" aria-hidden="true"><span class="notice-thumb"></span></span><span class="notice-toggle-text">Off</span>
      </button>
    </div>
    <button type="button" class="notice-test">Send test notification</button>
    <p class="notice-help">Notifications are silent. Keep this tab open; you can switch tabs while generation runs.</p>
  </section>
  <aside class="notice-preview" aria-label="In-page notification" hidden>
    <div class="notice-preview-copy" role="status" aria-live="polite">
      <strong class="notice-preview-title"></strong>
      <p class="notice-preview-body"></p>
    </div>
    <button type="button" class="notice-dismiss" aria-label="Dismiss in-page notification">×</button>
  </aside>
</div>
