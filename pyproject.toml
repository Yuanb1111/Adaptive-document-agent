[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-document-agent"
version = "0.1.0"
description = "Evidence-grounded, provider-independent analysis for arbitrary PDFs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["adaptive_document_agent*"]
